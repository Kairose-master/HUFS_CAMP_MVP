<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>꽃다발 입찰</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
:root{color-scheme:light;--bg:#F6F1E8;--card:#FFFDF9;--soft:#EFE9DE;--line:#E6DED1;--ink:#1E1B16;--muted:#6B655B;--green:#1F5A3C;--green-dark:#143D29;--green-tint:#E3EEE5;--orange:#B85A0C;--orange-tint:#FBEBD9;--up:#C2382B;--danger:#B3261E;--danger-tint:#FAE3E0;--photo:#ECE5D8;--off:#C9C1B3;--star:#C98A1B;
--sans:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#E9E2D5;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all}
h1,h2,h3,p,ul,dl,dd{margin:0}ul{padding:0;list-style:none}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed}
a{color:var(--green)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-weight:700}
.unit{font-size:.6em;font-weight:600;margin-left:1px;font-family:var(--sans);letter-spacing:0}
.muted{color:var(--muted)}.warn{color:var(--orange)}.down{color:var(--green)}.up{color:var(--up)}
/* 핸드오프: 컨텐츠 최대 폭 480px 중앙 정렬 */
.shell{max-width:480px;min-height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;height:56px;padding:0 12px 0 16px;background:var(--card);border-bottom:1px solid var(--line)}
.appbar.supplier{background:var(--ink);color:#fff;border-bottom-color:var(--ink)}
.appbar h1{font-size:16px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .who{font-size:12px;opacity:.8;white-space:nowrap}
.iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:10px;display:flex;align-items:center;justify-content:center;color:inherit}
.rolechip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--green-tint);color:var(--green);white-space:nowrap}
.supplier .rolechip{background:#fff;color:var(--ink)}
main{flex:1;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}
.tabbar{position:sticky;bottom:0;z-index:20;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;font-weight:500;color:var(--muted);text-decoration:none;position:relative}
.tabbar a[aria-current=page]{color:var(--green);font-weight:700}
.dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--danger);color:#fff;font:700 10px/16px var(--mono);text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card.tap{display:block;text-decoration:none;color:inherit}
.card.tap:hover{border-color:var(--green)}
.card.win{border:1.5px solid var(--green);background:#FBFDF9}
.card.dim{opacity:.55}
.h{font-size:15px;font-weight:700}.sub{font-size:12.5px;color:var(--muted)}
.ttl{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.row{display:flex;align-items:center;gap:10px}.row.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}.stack.tight{gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:#4A4439;white-space:nowrap}
.chip.green{background:var(--green-tint);color:var(--green)}.chip.orange{background:var(--orange-tint);color:var(--orange)}.chip.red{background:var(--danger-tint);color:var(--danger)}.chip.solid{background:var(--green);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 18px;border-radius:14px;border:0;background:var(--green);color:#fff;font-size:15px;font-weight:700;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--green-dark)}.btn.full{width:100%}
.btn.sm{height:44px;padding:0 14px;border-radius:10px;font-size:13.5px}
.btn.ghost{background:var(--card);color:var(--green);border:1.5px solid var(--green)}.btn.ghost:hover{background:var(--green-tint)}
.btn.quiet{background:var(--soft);color:var(--ink)}.btn.quiet:hover{background:#E6DED1}
.btn.orange{background:var(--orange)}.btn.danger{background:var(--card);color:var(--danger);border:1.5px solid var(--danger)}
.btn:disabled{background:var(--off);color:#fff;border-color:var(--off)}
.linkbtn{background:none;border:0;padding:8px 2px;font-size:13px;font-weight:600;color:var(--green);text-decoration:underline;text-underline-offset:3px}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{height:46px;padding:0 12px;border-radius:10px;border:1.5px solid var(--green);background:#fff;font-size:15px;font-weight:500;color:var(--ink);width:100%}
.field textarea{height:auto;min-height:76px;padding:10px 12px;resize:vertical;line-height:1.5}
.field input.num{font-family:var(--mono);font-weight:700;text-align:right;font-size:18px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:12px;background:var(--soft)}
.seg button{height:38px;border:0;border-radius:9px;background:transparent;font-size:13px;font-weight:600;color:#4A4439}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(30,27,22,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pick{height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:500}
.pick[aria-pressed=true]{border-color:var(--green);background:var(--green);color:#fff;font-weight:600}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;flex-shrink:0}
.avatar.c{background:#8A6A3B}.avatar.lg{width:60px;height:60px;font-size:22px}
.stars{color:var(--star);font-size:13px;letter-spacing:1px;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}.kv dt{color:var(--muted)}.kv dd{font-weight:500}
.line{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.line:first-child{border-top:0}
.ico{width:36px;height:36px;border-radius:9px;background:var(--photo);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nm{font-size:14px;font-weight:600;line-height:1.3}.nm small{font-weight:400;color:var(--muted);font-size:12px;margin-left:4px}
.qty{display:flex;align-items:center;gap:2px}
.qty button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center}
.qty .n{min-width:30px;text-align:center;font-size:16px}
.qty input{width:58px;height:40px;text-align:right;padding:0 8px;border-radius:8px;border:1.5px solid var(--green);background:#fff;font:700 16px var(--mono)}
.switch{width:44px;height:26px;border-radius:999px;border:0;background:var(--off);position:relative;padding:0;flex-shrink:0}.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)}.switch[aria-checked=true]{background:var(--green)}.switch[aria-checked=true]::after{left:21px}
.addbtn{height:40px;padding:0 16px;border-radius:10px;border:0;background:var(--green);color:#fff;font-size:13.5px;font-weight:700}
.boxbtn{height:40px;padding:0 10px;border-radius:10px;border:1.5px solid var(--green);background:var(--card);color:var(--green);font-size:12.5px;font-weight:700}
.bq-card{position:relative;height:270px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bq{position:absolute;inset:0}.bq-canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
.bq-tl{position:absolute;top:10px;left:10px}.bq-cap{position:absolute;left:10px;right:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:5px;pointer-events:none}
.bq-cap .chip,.bq-tl .chip{background:rgba(239,233,222,.92)}
.bq-empty{position:absolute;inset:12px;border:1.5px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;font-weight:600;background:var(--card)}
.bq-2d{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;padding:34px 24px}.bq-2d svg{margin:-6px -8px}
.miniseg{display:inline-flex;padding:3px;border-radius:999px;background:rgba(239,233,222,.92)}
.miniseg button{height:30px;padding:0 12px;border:0;border-radius:999px;background:transparent;font-size:12.5px;font-weight:600;color:#4A4439}
.miniseg button[aria-pressed=true]{background:var(--green);color:#fff}
.thumb{width:64px;height:64px;border-radius:10px;background:var(--photo);object-fit:cover;flex-shrink:0;display:block}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos button{padding:0;border:0;background:var(--photo);border-radius:10px;overflow:hidden;aspect-ratio:1;position:relative}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .tag{position:absolute;left:5px;bottom:5px;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:rgba(30,27,22,.72);color:#fff}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.strip .pick{flex-shrink:0}.strip img{width:72px;height:72px;border-radius:9px;object-fit:cover;background:var(--photo);flex-shrink:0}
.rv{padding:12px 0;border-top:1px solid var(--line)}.rv:first-child{border-top:0;padding-top:2px}
.rv img{width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-top:8px;display:block;background:var(--photo)}
.cmp{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.cmp table{border-collapse:collapse;table-layout:fixed;width:100%;min-width:calc(88px + 156px * var(--n))}
.cmp th,.cmp td{padding:10px 12px;border-top:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}
.cmp tr:first-child th,.cmp tr:first-child td{border-top:0}
.cmp th{width:88px;color:var(--muted);font-weight:600;font-size:12px;background:var(--soft);position:sticky;left:0}
.cmp td.best{background:#F3F8F3}
.cmp img{width:100%;height:92px;object-fit:cover;border-radius:8px;background:var(--photo);display:block}
.bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;border-radius:999px;background:var(--green)}.bar.over i{background:var(--orange)}
.note{padding:10px 12px;border-radius:10px;background:var(--green-tint);font-size:13px;color:#24503A}
.note.orange{background:var(--orange-tint);color:var(--orange);font-weight:600}
.note.soft{background:var(--soft);color:#4A4439}
.sticky-cta{position:sticky;bottom:57px;z-index:15;margin:0 -16px -24px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px}
.rate{display:flex;gap:4px}.rate button{width:44px;height:44px;border:0;background:transparent;font-size:26px;color:var(--off);padding:0}.rate button.on{color:var(--star)}
.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(20,18,14,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:12px}
.lightbox img{max-width:100%;max-height:80vh;border-radius:10px}.lightbox p{color:#fff;font-size:13px;opacity:.85;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;max-width:min(440px,calc(100% - 32px));padding:12px 18px;border-radius:12px;background:var(--ink);color:#fff;font-size:14px;font-weight:500;box-shadow:0 6px 24px rgba(30,27,22,.25)}
.login-acc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.login-acc:hover{border-color:var(--green)}
.steps{counter-reset:s}.steps li{counter-increment:s;display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:13px;padding:4px 0}
.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--green-tint);color:var(--green);font:700 12px/22px var(--mono);text-align:center}
</style>
</head>

function suggestOccasion(lines){
  var n={},tot=0;lines.forEach(function(l){var f=fl(l.id);if(f.green) return;n[l.id]=(n[l.id]||0)+l.qty;tot+=l.qty});if(!tot) return '생일';
  function sh(ids){return ids.reduce(function(a,i){return a+(n[i]||0)},0)/tot}
  if(sh(['mum','lily-w','lisi-w','rose-w'])>=0.7&&sh(['mum','lily-w'])>0) return '근조';
  if(sh(['carn','carn-r'])>=0.4) return '감사';
  if(sh(['rose'])>=0.4||sh(['peony'])>=0.25) return '기념일';
  if(sh(['sunf'])>=0.2) return '졸업·입학';
  if(sh(['gerb-o','hydr-b','hydr-p','mum-y'])>=0.35) return '축하';
  return '생일';
}
function fl(id){for(var i=0;i<FLOWERS.length;i++) if(FLOWERS[i].id===id) return FLOWERS[i]}
function price(f){return Math.round(f.box/f.per*f.margin/10)*10}
function flowersTotal(lines){return lines.reduce(function(a,l){return a+l.qty*price(fl(l.id))},0)}
function estimate(lines,method){var f=flowersTotal(lines);return lines.length?f+MATERIALS+DESIGN+(method==='배송'&&f<SHIP_FREE?SHIP:0):0}
function short(f){return f.name+(f.name==='리시안셔스'?' '+f.v:'')}
function summary(lines){return lines.map(function(l){return short(fl(l.id))+' '+l.qty}).join(' · ')}

  if(!file||!/^image\//.test(file.type)){toast('이미지 파일을 골라 주세요');return}
  var url=URL.createObjectURL(file), im=new Image();
  im.onload=function(){var m=900,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);cb(c.toDataURL('image/jpeg',0.78))};
  im.onerror=function(){URL.revokeObjectURL(url);toast('사진을 읽지 못했어요. 다른 사진으로 해 보세요.')};
  im.src=url;
}

    if(!(bq_>=1)){toast('수량을 1 이상으로 적어 주세요');return} if(bq_>lf2){toast('남은 수량은 '+lf2+fl(of2.flower).unit+'예요');ui.buy[id]=lf2;render();return}
    of2.sold+=bq_;S.stock[of2.fid][of2.flower]=Math.max(0,stockOf(of2.fid,of2.flower)-bq_);
    var oid2=++S.seq;S.orders.push({id:oid2,kind:'stems',offer:of2.id,by:session,fid:of2.fid,lines:[{id:of2.flower,qty:bq_}],unit:of2.price,price:bq_*of2.price,pickup:of2.pickup,status:'reserved',at:Date.now()});delete ui.buy[id];
    toast(short(fl(of2.flower))+' '+bq_+fl(of2.flower).unit+' 매수 · 주문 #'+oid2)}
  else if(act==='want-pickup'){ui.want.pickup=v}
  else if(act==='want-post'){var W=ui.want,wq=Math.round(Number(W.qty)),wp=Math.round(Number(W.price));if(!(wq>=1)||!(wp>=100)){toast('수량과 희망가를 확인해 주세요');return}
    S.wants.push({id:++S.seq,by:session,flower:W.flower,qty:wq,filled:0,price:wp,pickup:W.pickup,status:'open',at:Date.now()});ui.want=null;toast('매수 희망을 올렸어요. 꽃집이 남는 꽃으로 응하면 주문이 됩니다.')}
  else if(act==='want-cancel'){S.wants.filter(function(w){return w.id===+id})[0].status='off';toast('매수 희망을 내렸어요')}
  else if(act==='want-fill'){var w=S.wants.filter(function(x){return x.id===+id})[0],fq=Math.min(w.qty-w.filled,leftQty(session,w.flower));if(!(fq>0)){toast('남는 꽃이 없어요');return}
    w.filled+=fq;if(w.filled>=w.qty) w.status='done';S.stock[session][w.flower]=Math.max(0,stockOf(session,w.flower)-fq);
    S.orders.push({id:++S.seq,kind:'stems',want:w.id,by:w.by,fid:session,lines:[{id:w.flower,qty:fq}],unit:w.price,price:fq*w.price,pickup:w.pickup,status:'reserved',at:Date.now()});
    toast(short(fl(w.flower))+' '+fq+fl(w.flower).unit+'를 '+fmt(w.price)+'원에 팔았어요 · 픽업 예약에 추가')}
  else if(act==='sell-price'){ui.sell.price=+v}
  else if(act==='sell-pickup'){ui.sell.pickup=v}
  else if(act==='sell-post'){var SL=ui.sell,sq=Math.round(Number(SL.qty)),sp=Math.round(Number(SL.price)),mx=leftQty(session,SL.flower);if(!(sq>=1)||!(sp>=100)){toast('수량과 가격을 확인해 주세요');return} if(sq>mx){toast('남는 수량은 '+mx+fl(SL.flower).unit+'까지예요');return}
    S.offers.push({id:++S.seq,fid:session,flower:SL.flower,qty:sq,sold:0,price:sp,pickup:SL.pickup,status:'on',at:Date.now()});ui.sell=null;toast('매도를 올렸어요. 손님 앱 “송이로 사기”에 보입니다.')}
  else if(act==='sell-off'){S.offers.filter(function(o){return o.id===+id})[0].status='off';toast('매도를 내렸어요. 남은 꽃은 다시 남는 꽃으로 돌아옵니다.')}
  else if(act==='reserve'){var L=S.listings.filter(function(x){return x.id===+id})[0];if(!L||L.status!=='on'||L.sets-L.sold<1){toast('방금 품절됐어요');render();return}
    L.sold++;L.lines.forEach(function(l){S.stock[L.fid][l.id]=Math.max(0,stockOf(L.fid,l.id)-l.qty)});
    var oid=++S.seq;S.orders.push({id:oid,listing:L.id,by:session,fid:L.fid,lines:L.lines,price:L.price,pickup:L.pickup,status:'reserved',at:Date.now()});toast('예약했어요 · 주문 #'+oid)}
  else if(act==='pf-tag'){var tg=S.profiles[session].tags,i=tg.indexOf(v);if(i>-1) tg.splice(i,1); else if(tg.length<3) tg.push(v); else {toast('스타일은 3개까지 고를 수 있어요');return}}
  else if(act==='pf-save'){S.profiles[session].intro=(S.profiles[session].intro||'').trim();save();toast('프로필을 저장했어요')}
  save(); render();
});
window.addEventListener('hashchange',function(){ui.confirm=null;ui.photoOcc='전체';window.scrollTo(0,0);render()});
render();
})();
</script>
