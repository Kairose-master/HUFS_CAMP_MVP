<style>
*{box-sizing:border-box}
body{margin:0;background:#F2F2F7;color:#000000;font:400 17px/22px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard Variable',Pretendard,'Noto Sans KR',system-ui,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}

button,input{font:inherit;color:inherit;letter-spacing:inherit}button{cursor:pointer}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num,.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.t-lt{font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.025em}
.t-t2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.02em}.t-t3{font-size:20px;line-height:25px;font-weight:600;letter-spacing:-.02em}
.t-h{font-size:17px;line-height:22px;font-weight:600}.t-s{font-size:15px;line-height:20px}.t-f{font-size:13px;line-height:18px}.t-c{font-size:12px;line-height:16px}
.c2,.muted{color:#6C6C70}.c-tint{color:#0066CC}.c-red{color:#D70015}.c-orange{color:#A84A00}.c-green{color:#1D7A34}.b{font-weight:600}
.grow{flex:1;min-width:0}.r{text-align:right}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:44px;padding:0 8px;flex-shrink:0}
.nav-t{font-size:17px;line-height:22px;font-weight:600;text-align:center}.nav-r{justify-self:end;display:flex;align-items:center}
.backbtn{display:inline-flex;align-items:center;gap:1px;height:44px;padding:0 8px 0 0;font-size:17px;justify-self:start}
.iconbtn{width:44px;height:44px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center;color:#0066CC}
.lt{padding:2px 20px 10px}.lede{padding:0 20px 6px;font-size:15px;line-height:20px;color:#6C6C70}
.note{padding:0 20px 14px;font-size:13px;line-height:18px;color:#6C6C70}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 20px 10px}
.sec-h.has-n{margin-bottom:2px}.sec-n{margin:0 20px 10px;font-size:13px;line-height:18px;color:#6C6C70}
.sec-l{margin:24px 32px 7px;font-size:13px;line-height:18px;color:#6C6C70}.sec-f{margin:8px 32px 0;font-size:13px;line-height:18px;color:#6C6C70}
.cell{background:#FFFFFF;border-radius:20px;overflow:hidden}.group{margin:0 16px;background:#FFFFFF;border-radius:20px;overflow:hidden}.group+.group{margin-top:12px}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 16px;color:inherit}
.row+.row::before,.pad+.row::before,.row+.pad::before,.pad+.pad::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:rgba(60,60,67,.2)}
.row.in68+.row.in68::before{left:68px}
.pad{position:relative;padding:14px 16px}
.kv .v{flex:1;min-width:0;text-align:right;color:#6C6C70}
.tile{width:40px;height:40px;border-radius:10px;background:rgba(120,120,128,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(#73737A,#5C5C61);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;flex-shrink:0;letter-spacing:0}
.avatar.lg{width:60px;height:60px;font-size:26px}
.inbox{border-radius:12px;background:#F2F2F7;padding:10px 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:50px;padding:0 22px;border-radius:999px;border:0;background:#0071E3;color:#fff;font-size:17px;line-height:22px;font-weight:600;white-space:nowrap}
.btn.full{width:100%}.btn.md{min-height:44px;padding:0 18px;font-size:15px}.btn.gray{background:rgba(120,120,128,.12);color:#0066CC}.btn:disabled{background:rgba(120,120,128,.12);color:#6C6C70;cursor:default}

.cap::after,.chipb::after{content:"";position:absolute;inset:-6px 0}
.textbtn{border:0;background:none;padding:0;min-height:44px;color:#0066CC;font-size:15px;line-height:20px;display:inline-flex;align-items:center;gap:1px;white-space:nowrap}

.stp button::after{content:"";position:absolute;inset:-4px 0}.stp .n{min-width:26px;text-align:center;font-size:17px;font-weight:600}

.seg button{min-width:0;height:40px;border:0;border-radius:999px;background:transparent;font-size:15px;font-weight:500;padding:0 2px;white-space:nowrap}
.seg button[aria-pressed=true]{background:#FFFFFF;font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{position:relative;display:inline-flex;align-items:center;gap:2px;height:34px;padding:0 15px;border-radius:999px;border:0;background:rgba(120,120,128,.12);font-size:15px;line-height:20px;font-weight:500;white-space:nowrap}

.badge.green{background:rgba(29,122,52,.1);color:#1D7A34}.badge.orange{background:rgba(201,82,0,.1);color:#A84A00}.badge.red{background:rgba(215,0,21,.08);color:#D70015}

.badges{display:flex;flex-wrap:wrap;gap:6px}
.delta{display:inline-flex;align-items:center;gap:2px;font-weight:600;white-space:nowrap}
.fld{display:block;width:100%;height:40px;border:0;border-radius:10px;background:rgba(120,120,128,.12);padding:0 10px;text-align:right;font-size:17px;font-weight:600;color:#000000}
.fld.focus{box-shadow:0 0 0 3px rgba(0,113,227,.55)}
.ro{height:40px;display:flex;align-items:center;color:#6C6C70;font-size:17px}
.slider{-webkit-appearance:none;appearance:none;display:block;width:100%;height:28px;margin:0;background:transparent}
.slider::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,#0071E3 var(--p,50%),rgba(120,120,128,.2) var(--p,50%))}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-12px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16),0 0 0 .5px rgba(0,0,0,.04)}
.slider::-moz-range-track{height:4px;border-radius:2px;background:rgba(120,120,128,.2)}.slider::-moz-range-progress{height:4px;border-radius:2px;background:#0071E3}
.slider::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16)}

.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16)}
.switch[aria-checked=true]{background:#34C759}.switch[aria-checked=true]::after{transform:translateX(20px)}

.tabbar a[aria-current=page]{color:#0066CC;background:rgba(120,120,128,.12);font-weight:600}
.slider{--p:28.6%}</style>
